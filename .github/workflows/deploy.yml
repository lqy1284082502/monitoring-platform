name: Deploy demo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag-gate:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.tag.outputs.production }}
    steps:
      - id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint:prettier:check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    needs: [tag-gate, build]
    if: needs.tag-gate.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Publish release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEPLOY_API_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}
        run: |
          test -n "$DEPLOY_API_TOKEN"
          tar -C dist -czf site.tar.gz .
          curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 \
            -X POST "https://lqycustomsite.online/deployment-hook/projects/monitoring-platform/releases/${TAG}" \
            -H "Authorization: Bearer ${DEPLOY_API_TOKEN}" \
            -H "X-Deployment-Commit: ${SHA}" \
            -H "Content-Type: application/gzip" \
            --data-binary @site.tar.gz
