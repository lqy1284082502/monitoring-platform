name: Deploy demo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag-gate:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.tag.outputs.production }}
    steps:
      - id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint:prettier:check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    needs: [tag-gate, build]
    if: needs.tag-gate.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes site-deploy@lqycustomsite.online "/usr/local/bin/deploy-static prepare monitoring-platform $TAG"
          rsync -azc --delete --itemize-changes -e 'ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes' dist/ site-deploy@lqycustomsite.online:/srv/project-deployments/monitoring-platform/.staging/$TAG/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes site-deploy@lqycustomsite.online "/usr/local/bin/deploy-static publish monitoring-platform $TAG $SHA"
